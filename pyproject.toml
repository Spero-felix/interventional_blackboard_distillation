[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "interventional-blackboard-distillation"
version = "0.1.0"
description = "Four-expert Teacher and STATE/PLAN functional intervention distillation toolkit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "openai>=1.40,<3",
]

[project.optional-dependencies]
train = ["torch>=2.4,<3"]
test = ["pytest>=8,<10"]

[project.scripts]
ibd = "ibd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

