[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "interventional-blackboard-distillation"
version = "0.1.0"
description = "Four-expert Teacher and STATE/PLAN functional intervention distillation toolkit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "openai>=1.40,<3",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
train = [
  "torch>=2.6,<3",
  "transformers>=4.57,<5",
  "peft>=0.19,<1",
  "bitsandbytes>=0.49,<1",
  "safetensors>=0.8,<1",
]
test = ["pytest>=8,<10"]

[project.scripts]
ibd = "ibd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
