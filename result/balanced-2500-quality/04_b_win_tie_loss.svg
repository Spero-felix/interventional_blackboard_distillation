  <text x="48" y="58" class="title">Stage B win / tie / loss composition</text><text x="48" y="81" class="subtitle">Paired at the conversation level using each model’s five-dimension mean score.</text><text x="229" y="161" text-anchor="end" class="label">B vs Direct-B</text><rect x="245" y="140" width="215" height="28" fill="#2563eb"/><rect x="460" y="140" width="281.65" height="28" fill="#cbd5e1"/><rect x="741.65" y="140" width="148.35" height="28" fill="#f59e0b"/><text x="902" y="160" class="axis">100/131/69</text><text x="229" y="216" text-anchor="end" class="label">B vs Teacher</text><rect x="245" y="195" width="240.8" height="28" fill="#2563eb"/><rect x="485.8" y="195" width="215" height="28" fill="#cbd5e1"/><rect x="700.8" y="195" width="189.2" height="28" fill="#f59e0b"/><text x="902" y="215" class="axis">112/100/88</text><text x="229" y="271" text-anchor="end" class="label">B vs Visible SFT</text><rect x="245" y="250" width="222.19063545150502" height="28" fill="#2563eb"/><rect x="467.19063545150505" y="250" width="245.91973244147158" height="28" fill="#cbd5e1"/><rect x="713.1103678929767" y="250" width="176.8896321070234" height="28" fill="#f59e0b"/><text x="902" y="270" class="axis">103/114/82</text><text x="229" y="326" text-anchor="end" class="label">B vs Standard SFT</text><rect x="245" y="305" width="249.4" height="28" fill="#2563eb"/><rect x="494.4" y="305" width="258" height="28" fill="#cbd5e1"/><rect x="752.4" y="305" width="137.6" height="28" fill="#f59e0b"/><text x="902" y="325" class="axis">116/120/64</text><text x="229" y="381" text-anchor="end" class="label">B vs Stage A</text><rect x="245" y="360" width="251.55" height="28" fill="#2563eb"/><rect x="496.55" y="360" width="264.45" height="28" fill="#cbd5e1"/><rect x="761" y="360" width="129" height="28" fill="#f59e0b"/><text x="902" y="380" class="axis">117/123/60</text><text x="229" y="436" text-anchor="end" class="label">B vs Base Qwen</text><rect x="245" y="415" width="464.4" height="28" fill