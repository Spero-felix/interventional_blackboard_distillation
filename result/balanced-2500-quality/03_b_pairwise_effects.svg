  <text x="48" y="58" class="title">Stage B paired overall-score advantage</text><text x="48" y="81" class="subtitle">Mean of per-conversation differences; horizontal whiskers are approximate 95% intervals.</text><line x1="245" y1="125" x2="245" y2="476" stroke="#dce2ea" stroke-width="1"/><text x="245" y="502" text-anchor="middle" class="axis">-0.1</text><line x1="355.83333333333337" y1="125" x2="355.83333333333337" y2="476" stroke="#172033" stroke-width="1.5"/><text x="355.83333333333337" y="502" text-anchor="middle" class="axis">0.0</text><line x1="466.6666666666667" y1="125" x2="466.6666666666667" y2="476" stroke="#dce2ea" stroke-width="1"/><text x="466.6666666666667" y="502" text-anchor="middle" class="axis">+0.1</text><line x1="577.5" y1="125" x2="577.5" y2="476" stroke="#dce2ea" stroke-width="1"/><text x="577.5" y="502" text-anchor="middle" class="axis">+0.2</text><line x1="688.3333333333334" y1="125" x2="688.3333333333334" y2="476" stroke="#dce2ea" stroke-width="1"/><text x="688.3333333333334" y="502" text-anchor="middle" class="axis">+0.3</text><line x1="799.1666666666667" y1="125" x2="799.1666666666667" y2="476" stroke="#dce2ea" stroke-width="1"/><text x="799.1666666666667" y="502" text-anchor="middle" class="axis">+0.4</text><line x1="910" y1="125" x2="910" y2="476" stroke="#dce2ea" stroke-width="1"/><text x="910" y="502" text-anchor="middle" class="axis">+0.5</text><text x="229" y="159" text-anchor="end" class="label">B − Direct-B</text><line x1="413.87250781809246" y1="152" x2="525.3719366263521" y2="152" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/><circle cx="469.62222222222226" cy="152" r="7" fill="#2563eb"/><text x="538.3719366263521" y="157" class="value">+0.1027 (n=300)</text><text x="229" y="215" text-anchor="end" class="label">B − Teacher</text><line x1="434.36984120475836" y1="208" x2="566.9412699063529" y2="208" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/><circle cx="500.65555555555557" cy="208" r="7" fill="#2563eb"/><text x="579.9412699063529" y="213" class="value">+0.1307 (n=300)</text><text x="229" y="271" text-anchor="end" class="label">B − Visible SFT</text><line x1="424.80853050051286" y1="264" x2="556.7132086299221" y2="264" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/><circle cx="490.7608695652174" cy="264" r="7" fill="#2563eb"/><text x="569.7132086299221" y="269" class="value">+0.1217 (n=299)</text><text x="229" y="327" text-anchor="end" class="label">B − Standard SFT</text><line x1="451.39997811887673" y1="320" x2="557.3000218811235" y2="320" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/><circle cx="504.35000000000014" cy="320" r="7" fill="#2563eb"/><text x="570.3000218811235" y="325" class="value">+0.1340 (n=300)</text><text x="229" y="383" text-anchor="end" class="label">B − Stage A</text><line x1="457.8211843498306" y1="376" x2="559.745482316836" y2="376" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/><circle cx="508.78333333333336" cy="376" r="7" fill="#2563eb"/><text x="572.745482316836" y="381" class="value">+0.1380 (n=300)</text><text x="229" y="439" text-anchor="end" class="label">B − Base Qwen</text><line x1="750.0425457020388" y1="432" x2="863.068565409072" y2="432" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/><circle cx="806.5555555555554" cy="432" r="7" fill="#2563eb"/><text x="876.068565409072" y="437" class="value">+0.4067 (n=300)</text><text x="48" y="465" class="small">Positive values favor Stage B. Intervals summarize this holdout only and do not replace human evaluation.</text>
