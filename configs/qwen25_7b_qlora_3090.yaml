model_path: /homeb/wangnianxiang/models/Qwen2.5-7B-Instruct
load_in_4bit: true
bnb_4bit_quant_type: nf4
bnb_4bit_use_double_quant: true
bnb_4bit_compute_dtype: bfloat16
lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
lora_targets:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
max_length: 2048
micro_batch_size: 1
gradient_accumulation_steps: 8
gradient_checkpointing: true
optimizer: paged_adamw_8bit
learning_rate: 0.0002
slot_layer: 13
anchor_temperature: 0.07
cosine_weight: 1.0
state_weight: 1.0
plan_weight: 1.0
replay_weight: 0.1
epochs:
  A: 5
  B: 5
scheduler_type: cosine
warmup_ratio: 0.03
max_grad_norm: 1.0
evaluate_dev: true
early_stopping_patience: 2
save_every_epoch: true
