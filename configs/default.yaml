protocol_version: single-strategy-controllability-v3

backend:
  base_url_env: OPENAI_BASE_URL
  api_key_env: OPENAI_API_KEY
  timeout_seconds: 60

default_model:
  model: deepseek-v4-flash
  temperature: 0.0
  max_tokens: 1200
  thinking_enabled: false

candidate_seeds: [11, 29, 47]
schema_retries: 1
