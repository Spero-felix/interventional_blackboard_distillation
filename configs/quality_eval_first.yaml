protocol_version: generation-quality-v1
splits: [diagnostic_holdout]

models:
  - model_id: teacher
    source: teacher_trace
  - model_id: base
    source: base_qwen
    training_config: qwen25_7b_qlora_3090.yaml
  - model_id: ibd-b-8e-5
    source: student_checkpoint
    training_config: ../runs/first-plan-ab2000-lr-8e-5/training_config.yaml
    checkpoint: ../runs/first-plan-ab2000-lr-8e-5/stage-B-step-752
    run_name: first-plan-ab2000-lr-8e-5
  - model_id: standard-sft-8e-5
    source: standard_sft_checkpoint
    training_config: ../runs/first-plan-standard-sft-2000-lr-8e-5/training_config.yaml
    checkpoint: ../runs/first-plan-standard-sft-2000-lr-8e-5/stage-SFT-step-752
    run_name: first-plan-standard-sft-2000-lr-8e-5
  - model_id: visible-sft-2000-lr-8e-5
    source: visible_sft_checkpoint
    training_config: ../runs/first-plan-visible-sft-2000-lr-8e-5/training_config.yaml
    checkpoint: ../runs/first-plan-visible-sft-2000-lr-8e-5/stage-SFT-step-752
    run_name: first-plan-visible-sft-2000-lr-8e-5

generation:
  max_new_tokens: 256
  do_sample: false
  seed: 42

backend:
  base_url_env: OPENAI_BASE_URL
  api_key_env: OPENAI_API_KEY
  timeout_seconds: 60

judge:
  model: deepseek-v4-pro
  temperature: 0.0
  max_tokens: 1200
  supports_seed: false
  provider_json_mode: true
  thinking_enabled: false

judge_seed: 4242
judge_prompt_version: quality-judge-v1
human_seed: 2026
schema_retries: 1
teacher_model: deepseek-v4-flash
