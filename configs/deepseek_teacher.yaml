protocol_version: qwen25-socialsim-single-strategy-v5-others-dialogue-management

backend:
  base_url_env: OPENAI_BASE_URL
  api_key_env: OPENAI_API_KEY
  timeout_seconds: 120
  cache_dir: cache/teacher-first-plan-2000

default_model:
  model: deepseek-v4-pro
  temperature: 0.0
  max_tokens: 1200
  thinking_enabled: false

roles:
  multi_view_state_analyzer:
    model: deepseek-v4-flash
    temperature: 0.0
    max_tokens: 1400
    provider_json_mode: true
    thinking_enabled: false
  state_counterfactual_generator:
    model: deepseek-v4-flash
    temperature: 0.0
    max_tokens: 300
    provider_json_mode: true
    thinking_enabled: false
  candidate:
    model: deepseek-v4-flash
    temperature: 0.7
    max_tokens: 800
    provider_json_mode: false
    thinking_enabled: false
  final_selector:
    model: deepseek-v4-flash
    temperature: 0.0
    max_tokens: 1200
    provider_json_mode: true
    thinking_enabled: false
  safety_verifier:
    model: deepseek-v4-flash
    temperature: 0.0
    max_tokens: 1000
    thinking_enabled: false
  condition_effect_verifier:
    model: deepseek-v4-flash
    temperature: 0.0
    max_tokens: 800
    thinking_enabled: false
  state_effect_verifier:
    model: deepseek-v4-flash
    temperature: 0.0
    max_tokens: 800
    thinking_enabled: false

schema_retries: 1
